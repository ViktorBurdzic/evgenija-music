<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hvala – Evgenija</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FAF8F3;
    color: #1A1714;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 300;
    font-style: italic;
    color: #8B3A2A;
    margin-bottom: 1rem;
  }
  p {
    font-size: 1rem;
    color: #6B5E4E;
    max-width: 400px;
    line-height: 1.8;
    margin-bottom: 2.5rem;
  }
  a {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #1A1714;
    text-decoration: none;
    padding: 0.9rem 2.5rem;
    border: 0.5px solid #1A1714;
    transition: background 0.2s, color 0.2s;
  }
  a:hover { background: #1A1714; color: #FAF8F3; }
</style>
</head>
<body>
  <h1>Hvala!</h1>
  <p>Vaša poruka je uspešno poslata. Evgenija će Vam se javiti u roku od 24 sata.</p>
  <a href="https://viktorburdzic.github.io/evgenija-music/">Nazad na sajt</a>
</body>
</html>
